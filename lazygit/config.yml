gui:
  theme:
    activeBorderColor:
      - '#89b4fa'
      - bold
    inactiveBorderColor:
      - '#a6adc8'
    optionsTextColor:
      - '#89b4fa'
    selectedLineBgColor:
      - '#313244'
    cherryPickedCommitBgColor:
      - '#45475a'
    cherryPickedCommitFgColor:
      - '#89b4fa'
    unstagedChangesColor:
      - '#f38ba8'
    defaultFgColor:
      - '#cdd6f4'
    searchingActiveBorderColor:
      - '#f9e2af'
os:
  editPreset: nvim-remote
  edit: 'nvim --server "$NVIM" --remote-expr "v:lua.lazygit_open_file(\"{{filename}}\")"'
  editAtLine: 'nvim --server "$NVIM" --remote-expr "v:lua.lazygit_open_file(\"{{filename}}\", {{line}})"'
